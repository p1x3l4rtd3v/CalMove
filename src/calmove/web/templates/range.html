{% extends "base.html" %}
{% block body %}
<h2>Date range</h2>
{% if message %}<p class="error">{{ message }}</p>{% endif %}
<form method="post">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label><input type="radio" name="preset" value="future" checked> From today onward</label>
  <label><input type="radio" name="preset" value="everything"> Everything</label>
  <label><input type="radio" name="preset" value="custom"> Custom:
    from <input type="date" name="start"> to (inclusive) <input type="date" name="end"></label>
  <button type="submit">Plan migration (dry run)</button>
</form>
{% endblock %}
