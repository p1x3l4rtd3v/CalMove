{% extends "base.html" %}
{% block head %}<script src="{{ url_for('static', filename='range.js') }}" defer></script>{% endblock %}
{% block body %}
<h2>Date range</h2>
{% if message %}<p class="error">{{ message }}</p>{% endif %}
<form method="post">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label><input type="radio" name="preset" value="future" checked> From today onward</label>
  <label><input type="radio" name="preset" value="everything"> Everything</label>
  <label><input type="radio" name="preset" value="custom" id="preset-custom"> Custom:
    from <input type="date" name="start" id="range-start">
    to (inclusive) <input type="date" name="end" id="range-end"></label>
  <button type="submit">Plan migration (dry run)</button>
</form>
{% endblock %}
