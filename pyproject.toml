[project]
name = "calmove"
version = "0.1.0"
description = "Migrate a Google Calendar from an old Google Workspace to a new one via the Google Calendar API."
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client",
    "google-auth",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "keyring",
    "typer",
    "rich",
]

[project.scripts]
calmove = "calmove.cli.main:app"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "pip-audit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calmove"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = [
    "googleapiclient.*",
    "google_auth_oauthlib.*",
    "google.*",
    "keyring.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "calmove.cli.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# google-auth ships py.typed but leaves Credentials methods untyped; this module
# is the thin wrapper around that SDK, so untyped-call/Any-return checks are relaxed here only.
[[tool.mypy.overrides]]
module = "calmove.infrastructure.google.auth"
disallow_untyped_calls = false
warn_return_any = false
